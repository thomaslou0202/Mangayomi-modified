name: Test Windows Linovelib phone profile
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linovelib-windows-preview
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.config.outputs.source }}
      version: ${{ steps.config.outputs.version }}
      build: ${{ steps.config.outputs.build }}
    steps:
      - id: config
        run: |
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=0.9.95" >> "$GITHUB_OUTPUT"
          echo "build=142" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out patch repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: patches
      - name: Check out matching upstream Mangayomi source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.source }}
          path: app
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate complete Traditional Chinese localization
        working-directory: app
        run: flutter gen-l10n
      - name: Analyze custom app changes
        working-directory: app
        shell: pwsh
        run: |
          dart analyze
      - name: Set up Node for source comment DOM tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patches/package-lock.json
      - name: Test source website comment location
        working-directory: patches
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          dart ../app/tool/export_comments_script.dart comments-focus.js
          node --test release-support/comments-locator.test.cjs
      - name: Run release regression tests
        working-directory: app
        run: >-
          flutter test --no-pub --concurrency=1
          test/modules/manga/detail/comments_test.dart
          test/modules/manga/detail/detail_action_strip_test.dart
          test/modules/manga/detail/comments_navigation_test.dart
          test/modules/manga/detail/update_manga_detail_lifecycle_test.dart
          test/modules/about/app_release_test.dart
          test/modules/browse/source_metadata_test.dart
          test/services/database_worker_test.dart
          test/services/library_chapter_summary_test.dart
          test/services/sync_oauth_callback_test.dart
          test/services/sync_background_transport_test.dart
          test/services/sync_checkpoint_test.dart
          test/modules/library/library_unread_sort_test.dart
          test/repositories/manga_repository_test.dart
          test/modules/more/data_and_storage/restore_replace_test.dart
          test/settings/settings_clobber_test.dart
          test/modules/novel_continuous_reader_test.dart
          test/modules/novel_content_test.dart
          test/modules/manga/reader/reader_leading_boundary_test.dart
          test/modules/manga/reader/reader_pages_test.dart
          test/services/linovelib_browser_profile_test.dart
          test/services/webview_request_profile_test.dart
          test/services/detail_refresh_state_test.dart
          test/modules/novel_illustration_test.dart
          test/modules/novel_inline_html_test.dart
          test/modules/novel_double_page_test.dart
          test/modules/novel_ref_after_dispose_test.dart
          test/l10n/traditional_chinese_test.dart
          test/l10n/episode_count_test.dart
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --no-pub --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build }}
      - name: Package Windows release
        shell: pwsh
        run: |
          $expected = '${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build }}'
          $version = (Get-Item app/build/windows/x64/runner/Release/mangayomi.exe).VersionInfo.ProductVersion
          if ($version -ne $expected) { throw "Windows product version '$version' does not match '$expected'" }
          New-Item -ItemType Directory -Path dist
          Copy-Item patches/release-support/WINDOWS-READER-PREVIEW.md app/build/windows/x64/runner/Release/INSTALL-zh-TW.md
          Copy-Item app/LICENSE app/build/windows/x64/runner/Release/LICENSE.Mangayomi.txt
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/Mangayomi-windows.zip
          Get-FileHash dist/Mangayomi-windows.zip -Algorithm SHA256 | Format-List
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-windows-preview-142
          path: dist/Mangayomi-windows.zip
          if-no-files-found: error
          retention-days: 14