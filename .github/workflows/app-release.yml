name: Build Windows Linovelib reader trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-linovelib-reader-trial
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.config.outputs.source }}
      version: ${{ steps.config.outputs.version }}
      build: ${{ steps.config.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: config
        run: |
          python3 - <<'PY'
          import json, os, re
          c = json.load(open('app-release.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', c['source'])
          assert re.fullmatch(r'\d+\.\d+\.\d+', c['version'])
          assert isinstance(c['build'], int) and c['build'] > 131
          assert c['tag'] == 'v'+c['version']+'+'+str(c['build'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key in ['source', 'version', 'build']: f.write(f'{key}={c[key]}\n')
          PY
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out patch repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: patches
      - name: Check out matching upstream Mangayomi source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.source }}
          path: app
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate complete Traditional Chinese localization
        working-directory: app
        run: flutter gen-l10n
      - name: Analyze custom app changes
        working-directory: app
        shell: pwsh
        run: |
          dart analyze
      - name: Set up Node for source comment DOM tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patches/package-lock.json
      - name: Test source website comment location
        working-directory: patches
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          dart ../app/tool/export_comments_script.dart comments-focus.js
          node --test release-support/comments-locator.test.cjs
      - name: Test novel rendering and chapter refresh
        working-directory: app
        run: flutter test --no-pub test/modules/novel_continuous_reader_test.dart test/modules/novel_inline_html_test.dart test/services/webview_request_profile_test.dart test/services/detail_refresh_state_test.dart
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --no-pub --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ needs.prepare.outputs.build }}
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item patches/release-support/RELEASE-NOTES.md app/build/windows/x64/runner/Release/INSTALL-zh-TW.md
          Copy-Item app/LICENSE app/build/windows/x64/runner/Release/LICENSE.Mangayomi.txt
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/Mangayomi-windows.zip
          Get-FileHash dist/Mangayomi-windows.zip -Algorithm SHA256 | Format-List
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-windows
          path: dist/Mangayomi-windows.zip
          if-no-files-found: error
          retention-days: 14
